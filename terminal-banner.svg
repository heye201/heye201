  <text x="42" y="152" class="mono" fill="#f2f7f5" font-size="43" font-weight="bold">Eduardo Martins</text>
  <text x="42" y="194" class="mono muted" font-size="22">Backend  /  Segurança da Informação  /  IA aplicada</text>
