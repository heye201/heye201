  <rect width="1200" height="270" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="268" rx="15" fill="none" stroke="#2c5d59" stroke-width="2"/>
  <path d="M16 46H1184" stroke="#244344"/>
