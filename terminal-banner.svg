<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Eduardo Martins — desenvolvimento, segurança e IA</title>
  <desc id="desc">Banner de terminal com o nome Eduardo Martins e suas áreas de atuação.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#08131a"/>
      <stop offset="1" stop-color="#102b2d"/>
    </linearGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace}
      .muted{fill:#92a9a9}
      .accent{fill:#00d9a6}
